[package]
name = "stryi_storage"
version = "0.0.1"
edition = "2024"
authors = ["Rosenthall <rosenthall@riseup.net>"]
license = "BSD-3-Clause"


[features]
chaingen = []

[dependencies]
rocksdb = { version = "=0.25.0", default-features = false, features = ["bindgen-runtime", "lz4"] }
stryi_core = { path = "../stryi_core" }
tracing = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }

[dev-dependencies] # Need these to perform tests
tempfile = "3.27.0"
rand = { workspace = true }
