[package]
name = "stryi_storage"
version = "0.0.1"
edition = "2024"
authors = ["Rosenthall <rosenthall@riseup.net>"]
license = "BSD-3-Clause"


[features]
chaingen = []

[dependencies]
fjall = "3.1.8"
stryi_core = { path = "../stryi_core" }
thiserror = "2"
tracing = "0.1.44"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["sync"] }
futures = "0.3.33"
blake3 = "1.8.5"
futures-core = "0.3.33"
indexmap = { version = "2.14.0", features = ["serde"] }

[dev-dependencies] # Need these to perform tests
tempfile = "3.27.0"
tokio = {version = "1.53.1", features = ["rt", "macros"]}
rand = "0.10.2"
