syntax = "proto3";

package stryi.sync;

import "google/protobuf/empty.proto";

//---------------------------------------------
// High-level chain info
// Meant for requesting when
// Initial-Block-Downloading process
// and just new node initialization
//---------------------------------------------
message ChainInfo {
  uint64 height            = 1; // Current main chain height
  string latest_block_hash = 2; // Hash of the chain's head block
  uint64 total_difficulty  = 3; // Summed chain work (PoW difficulty)
  uint64 last_update_time  = 4; // Unix timestamp of last chain update
  uint32 protocol_version  = 5; // Protocol version for compatibility
  string chain_name        = 6; // E.g. "Testnet", "Mainnet", or custom
}

//---------------------------------------------
// Requests for blocks or headers by height
//---------------------------------------------
message BlockHeightRange {
  uint64 start_height = 1; // Inclusive start
  uint64 end_height   = 2; // Inclusive end
  uint32 max_blocks   = 3; // Limit for streaming
}

//---------------------------------------------
// Requests for blocks by a list of hashes
//---------------------------------------------
message BlockHashList {
  // Hashes in human-readable native format with prefix
  repeated string block_hashes = 1;
}

//---------------------------------------------
// Full block object
//---------------------------------------------
message Block {
  BlockHeader          header = 1;
  SerializedBlockBody  body   = 2;
}

//---------------------------------------------
// Definition of block header structure
// Can be easily mapped to Rust structure.
//---------------------------------------------
message BlockHeader {
  uint32 version             = 1;

  string  merkle_root_hash   = 2;
  string previous_block_hash = 3;

  uint64 height              = 4;
  uint32 difficulty_bits     = 5;
  uint64 timestamp           = 6;
  uint32 nonce               = 7;
  bool   is_genesis          = 8;
}

//---------------------------------------------
// Serialized body of block.
// Body content is serialized using `bincode` (Rust binary serialization),
// chosen for simplicity and performance.
// Some reasoning:
// That's simple and allows us to reduce complexity of the network layer
// No real need of being able to use this in different languages for now.
// Note: As far as I know there are several bincode implementations for other languages/platforms, so it is still possible,
// but no protobuf definitions are provided
//---------------------------------------------
message SerializedBlockBody {
  bytes serialized = 1;
}

//---------------------------------------------
// Bincode-serialized transaction.
// Pretty the same thing as in SerializedBlockBody, storing as bytes.
//---------------------------------------------
message SerializedTransaction {
  bytes data = 1;
}

//---------------------------------------------
// gRPC service for chain synchronization
//---------------------------------------------
service BlockchainSync {
  // Basic chain info (height, head hash, difficulty, etc.)
  rpc GetChainInfo (google.protobuf.Empty) returns (ChainInfo);

  // Retrieve block headers by a height range (stream)
  rpc GetHeadersByHeight (BlockHeightRange) returns (stream BlockHeader);

  // Retrieve full blocks by a height range (stream)
  rpc GetBlocksByHeight (BlockHeightRange) returns (stream Block);

  // Retrieve full blocks by a list of hashes (stream)
  rpc GetBlocksByHash (BlockHashList) returns (stream Block);

  // something else?
}
