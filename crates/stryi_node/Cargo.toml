[package]
name = "stryi_node"
version = "0.0.2"
edition = "2024"
description = "An implementation of the node for the Stryi Chain!"
authors = ["Rosenthall <rosenthall@riseup.net>"]
license = "BSD-3-Clause"
build = "build.rs"

[[bin]]
name = "stryi_node"
path = "src/main.rs"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
console-subscriber = "0.4.1"
tokio = {version = "1.45.0", features = ["rt", "macros", "rt-multi-thread", "tracing"]}
tokio-stream = "0.1.17"
tokio-util = "0.7.14"
stryi_network = {path = "../stryi_network"}
stryi_core = {path = "../stryi_core"}
stryi_storage = {path = "../stryi_storage"}
futures-util = "0.3.31"
clap = { version = "4.5.27", features = ["derive"] }
tonic = { version = "0.13.0", features = ["tls-aws-lc"] }
prost = "0.13.5"
serde_json = "1.0.137"
thiserror = "2.0.12"
colored = "3.0.0"
bincode = "2.0.0-rc.3"
tower = "0.5.2"
zeroize = "1.8.1"
pem = "3.0.4"
rcgen = { version = "0.13.2", features = ["crypto", "x509-parser"] }
rustls-pki-types = "1.11.0"
pkcs8 = "0.10.2"
serde = { version = "1.0.219", features = ["derive"] }
figment = { version = "0.10.19", features = ["toml"] }
serde_with = "3.12.0"
http = "1.3.1"
http-body = "1.0.1"

[dev-dependencies]
x509-parser = "0.17.0"

[build-dependencies]
prost = "0.13.5"
tonic-build = { version = "0.13.0", features = ["prost"]}
