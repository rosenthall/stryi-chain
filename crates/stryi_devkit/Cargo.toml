[package]
name = "stryi_devkit"
version = "0.0.1"
edition = "2024"
authors = ["Rosenthall <rosenthall@riseup.net>"]

[[bin]]
name = "stryi-devkit"
path = "src/main.rs"


[dependencies]
clap = { version = "4.5.48", features = ["derive"]}
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
stryi_core = {path = "../stryi_core"}
stryi_storage = {path = "../stryi_storage"}
toml = "0.9.7"
tokio = {version = "1.45.0", features = ["rt", "macros", "rt-multi-thread"]}
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
rand = "0.10.0-rc.0"
rand_chacha = "0.9.0"
rayon = "1.11.0"
bincode = { version = "2.0.0-rc.3", features = ["serde"] }

