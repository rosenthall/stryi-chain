[package]
name = "stryi_devkit"
version = "0.0.1"
edition = "2024"
authors = ["Rosenthall <rosenthall@riseup.net>"]

[[bin]]
name = "stryi-devkit"
path = "src/main.rs"


[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
stryi_core = { path = "../stryi_core" }
stryi_storage = { path = "../stryi_storage", features = ["chaingen"] }
toml = "1.1.3"
tokio = { version = "1.53.1", features = ["rt", "macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
rand = "0.10.2"
rand_chacha = "0.10.0"
rayon = "1.12.0"
postcard = { version = "1", features = ["use-std"] }
k256 = { version = "0.14", features = ["serde", "ecdsa"] }
tracing = "0.1.44"
indexmap = "2.14.0"
