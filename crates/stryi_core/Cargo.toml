[package]
name = "stryi_core"
version = "0.0.1"
edition = "2024"
authors = ["Rosenthall <rosenthall@riseup.net>"]
license = "BSD-3-Clause"

[dependencies]
thiserror = "2"
hex = "0.4.3"
blake3 = "1.8.5"
k256 = { version = "0.14", features = ["serde", "ecdsa"] }
rand = "0.10.2"
hashx = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
rayon = "1.12.0"
tokio = { version = "1.53.1", features = ["sync", "rt"] }
petgraph = "0.8.3"
dashmap = "6.2.1"
futures = "0.3.33"
tracing = "0.1.44"
base64 = "0.23.0"
comfy-table = "7.2.2" # for debug display of blocks and transactions

[dev-dependencies]
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt", "macros"] } # Need this to perform tests
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "mining_memcpy"
harness = false
