[package]
name = "stryi_core"
version = "0.0.1"
edition = "2024"
authors = ["Rosenthall <rosenthall@riseup.net>"]
license = "BSD-3-Clause"

[dependencies]
thiserror = "2"
hex = "0.4.3"
blake3 = "1.8.2"
k256 = {version = "0.13", features = ["serde", "ecdsa"]}
rand = "0.9.0-beta"
hashx = "0.2.1"
serde = { version = "1.0.217", features = ["derive"] }
bincode = { version = "2.0.0-rc.3", features = ["serde"] }
rayon = "1.10.0"
tokio = {version = "1.43.0", features = ["sync", "rt"]}
petgraph = "0.7.1"
dashmap = "6.1.0"
futures = "0.3.31"
tracing = "0.1.41"
base64 = "0.22.1"
comfy-table = "7.2.1" # for debug display of blocks and transactions

[dev-dependencies]
serde_json = "1"
tokio = {version = "1.43.0", features = ["rt", "macros"]} # Need this to perform tests
