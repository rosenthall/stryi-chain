[package]
name = "stryi_core"
version = "0.0.1"
edition = "2024"
authors = ["Rosenthall <rosenthall@riseup.net>"]
license = "BSD-3-Clause"

[dependencies]
thiserror = "2"
hex = "0.4.3"
blake3 = "1.5.5"
p256 = { version = "0.13.2", features = ["serde", "ecdsa"] }
rand = "0.9.0-beta"
hashx = "0.2.1"
old_rand = { version = "0.8.5", package = "rand" }
serde = { version = "1.0.217", features = ["derive"] }
argon2 = "0.6.0-pre.1"
bincode = { version = "2.0.0-rc.3", features = ["serde"] }

[dev-dependencies]
serde_json = "1"