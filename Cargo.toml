[workspace]
members = [
    "crates/stryi_core", # Contains core logic of the blockchain, also includes some important data structures
    "crates/stryi_node", # Contains the Stryi blokchain node implementation
    "crates/stryi_storage", # Contains the implementation of storages for UTXO's, blocks and mempool
    "crates/stryi_network", # Contains stryi-network, p2p and protocols high-level api.
    "crates/stryi_devkit", # Contains cli tools and utilities for development and testing: chaingen, loadgen, etc.
    "crates/stryi_wallet" # Contains TUI wallet API
]
resolver = "3"


[profile.dev]
incremental = true
codegen-units = 256
debug = 1


[profile.release]
lto = "fat"
codegen-units = 1 # for better LTO opts
