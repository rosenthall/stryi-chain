name: "E2E: IBD Sync + Chain Reorganization"

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Run E2E
        working-directory: e2e/docker
        run: |
          set -euo pipefail
          DC="docker compose -f docker-compose.e2e.yml"
          SVC="wait-for-reorg"

          $DC up -d --build "$SVC"

          $DC logs -f --no-color &
          LOGS_PID=$!
          trap 'kill "$LOGS_PID" 2>/dev/null || true' EXIT

          $DC wait "$SVC" >/dev/null 2>&1 || true

          # `ps` must include exited containers because `wait-for-reorg` is one-shot.
          CID="$($DC ps -a -q "$SVC")"
          if [ -z "$CID" ]; then
            echo "ERROR: '$SVC' container still not found. Dumping compose state:"
            $DC ps -a
            exit 1
          fi
          
          EXIT_CODE="$(docker inspect -f '{{.State.ExitCode}}' "$CID")"
          echo "Service '$SVC' exited with code: $EXIT_CODE"
          exit "$EXIT_CODE"

      - name: Collect metrics
        if: always()
        working-directory: e2e/docker
        run: bash ../scripts/collect-benchmark.sh

      - name: Upload benchmark data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_number }}
          path: /tmp/benchmark.json
          retention-days: 90

      - name: Dump logs on failure
        if: failure()
        working-directory: e2e/docker
        run: docker compose -f docker-compose.e2e.yml logs

      - name: Cleanup
        if: always()
        working-directory: e2e/docker
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans
