name: "E2E"

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario to run"
        required: true
        default: "reorg"
        type: choice
        options:
          - reorg
          - tx-lifecycle

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Resolve scenario
        id: scenario
        run: |
          case "${{ inputs.scenario }}" in
            reorg)
              echo "compose_args=-p stryi-e2e-reorg -f docker-compose.e2e.yml -f docker-compose.e2e.reorg.yml" >> "$GITHUB_OUTPUT"
              echo "target_service=wait-for-reorg" >> "$GITHUB_OUTPUT"
              echo "benchmarks=true" >> "$GITHUB_OUTPUT"
              echo "build_devkit=true" >> "$GITHUB_OUTPUT"
              echo "artifact_name=e2e-reorg-benchmark-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
              ;;
            tx-lifecycle)
              echo "compose_args=-p stryi-e2e-tx-lifecycle -f docker-compose.e2e.yml -f docker-compose.e2e.tx-lifecycle.yml" >> "$GITHUB_OUTPUT"
              echo "target_service=wait-for-tx-lifecycle" >> "$GITHUB_OUTPUT"
              echo "benchmarks=false" >> "$GITHUB_OUTPUT"
              echo "build_devkit=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported scenario: ${{ inputs.scenario }}" >&2
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build cached node image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: e2e/docker/node.Dockerfile
          tags: stryi-e2e-node:ci
          load: true
          cache-from: |
            type=gha,scope=e2e-rust-chef
            type=gha,scope=e2e-node
          cache-to: |
            type=gha,mode=max,scope=e2e-rust-chef
            type=gha,mode=max,scope=e2e-node

      - name: Build cached tools image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: e2e/docker/tools.Dockerfile
          tags: stryi-e2e-tools:ci
          load: true
          cache-from: |
            type=gha,scope=e2e-rust-chef
            type=gha,scope=e2e-tools
          cache-to: type=gha,mode=max,scope=e2e-tools

      - name: Build cached devkit image
        if: steps.scenario.outputs.build_devkit == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: e2e/docker/devkit.Dockerfile
          tags: stryi-e2e-devkit:ci
          load: true
          cache-from: |
            type=gha,scope=e2e-rust-chef
            type=gha,scope=e2e-devkit
          cache-to: type=gha,mode=max,scope=e2e-devkit

      - name: Install Bencher
        if: steps.scenario.outputs.benchmarks == 'true'
        uses: bencherdev/bencher@main

      - name: Run E2E
        working-directory: e2e/docker
        run: |
          set -euo pipefail
          DC="docker compose ${{ steps.scenario.outputs.compose_args }}"
          SVC="${{ steps.scenario.outputs.target_service }}"

          $DC up -d --remove-orphans "$SVC"

          $DC logs -f --no-color &
          LOGS_PID=$!
          trap 'kill "$LOGS_PID" 2>/dev/null || true' EXIT

          $DC wait "$SVC" >/dev/null 2>&1 || true

          CID="$($DC ps -a -q "$SVC")"
          if [ -z "$CID" ]; then
            echo "ERROR: '$SVC' container still not found. Dumping compose state:"
            $DC ps -a
            exit 1
          fi

          EXIT_CODE="$(docker inspect -f '{{.State.ExitCode}}' "$CID")"
          echo "Service '$SVC' exited with code: $EXIT_CODE"
          exit "$EXIT_CODE"

      - name: Collect benchmark metrics
        if: always() && steps.scenario.outputs.benchmarks == 'true'
        id: collect_metrics
        working-directory: e2e/docker
        env:
          BENCHMARK_COMPOSE_ARGS: ${{ steps.scenario.outputs.compose_args }}
        run: bash ../scripts/collect-benchmark.sh

      - name: Upload benchmark artifacts
        if: always() && steps.collect_metrics.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.scenario.outputs.artifact_name }}
          path: |
            /tmp/benchmark.json
            /tmp/benchmark-summary.md
            /tmp/benchmark.bmf.json
          retention-days: 90

      - name: Publish Bencher report
        if: always() && steps.collect_metrics.outcome == 'success'
        env:
          BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bencher run \
            --project "$BENCHER_PROJECT" \
            --token "$BENCHER_API_TOKEN" \
            --branch "${GITHUB_REF_NAME}" \
            --testbed ubuntu-latest \
            --adapter json \
            --file /tmp/benchmark.bmf.json \
            --github-actions "$GITHUB_TOKEN"

      - name: Announce result locations
        if: always()
        env:
          BENCHER_PROJECT_URL: ${{ vars.BENCHER_PROJECT_URL }}
        run: |
          if [ "${{ steps.scenario.outputs.benchmarks }}" = "true" ]; then
            if [ -n "${BENCHER_PROJECT_URL}" ]; then
              echo "::notice title=E2E result::Scenario '${{ inputs.scenario }}' finished. Open the job Summary tab for the Bencher report, download the ${{ steps.scenario.outputs.artifact_name }} artifact for the benchmark JSON and Markdown files, or view history at ${BENCHER_PROJECT_URL}."
            else
              echo "::notice title=E2E result::Scenario '${{ inputs.scenario }}' finished. Open the job Summary tab for the Bencher report or download the ${{ steps.scenario.outputs.artifact_name }} artifact for the benchmark JSON and Markdown files."
            fi
          else
            echo "::notice title=E2E result::Scenario '${{ inputs.scenario }}' finished. This scenario does not publish benchmark artifacts."
          fi

      - name: Dump logs on failure
        if: failure()
        working-directory: e2e/docker
        run: docker compose ${{ steps.scenario.outputs.compose_args }} logs

      - name: Cleanup
        if: always()
        working-directory: e2e/docker
        run: docker compose ${{ steps.scenario.outputs.compose_args }} down -v --remove-orphans
