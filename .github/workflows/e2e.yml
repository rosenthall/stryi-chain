name: "E2E"

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install Bencher
        uses: bencherdev/bencher@main

      - name: Run E2E
        working-directory: e2e/docker
        run: |
          set -euo pipefail
          DC="docker compose -f docker-compose.e2e.yml"
          SVC="wait-for-reorg"

          $DC up -d --build "$SVC"

          $DC logs -f --no-color &
          LOGS_PID=$!
          trap 'kill "$LOGS_PID" 2>/dev/null || true' EXIT

          $DC wait "$SVC" >/dev/null 2>&1 || true

          # `ps` must include exited containers because `wait-for-reorg` is one-shot.
          CID="$($DC ps -a -q "$SVC")"
          if [ -z "$CID" ]; then
            echo "ERROR: '$SVC' container still not found. Dumping compose state:"
            $DC ps -a
            exit 1
          fi
          
          EXIT_CODE="$(docker inspect -f '{{.State.ExitCode}}' "$CID")"
          echo "Service '$SVC' exited with code: $EXIT_CODE"
          exit "$EXIT_CODE"

      - name: Collect benchmark metrics
        if: always()
        id: collect_metrics
        working-directory: e2e/docker
        run: bash ../scripts/collect-benchmark.sh

      - name: Upload benchmark artifacts
        if: always() && steps.collect_metrics.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: e2e-benchmark-${{ github.run_number }}
          path: |
            /tmp/benchmark.json
            /tmp/benchmark-summary.md
            /tmp/benchmark.bmf.json
          retention-days: 90

      - name: Publish Bencher report
        if: always() && steps.collect_metrics.outcome == 'success'
        env:
          BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bencher run \
            --project "$BENCHER_PROJECT" \
            --token "$BENCHER_API_TOKEN" \
            --branch "${GITHUB_REF_NAME}" \
            --testbed ubuntu-latest \
            --adapter json \
            --file /tmp/benchmark.bmf.json \
            --github-actions "$GITHUB_TOKEN"

      - name: Announce Bencher report location
        if: always()
        env:
          BENCHER_PROJECT_URL: ${{ vars.BENCHER_PROJECT_URL }}
        run: |
          if [ -n "${BENCHER_PROJECT_URL}" ]; then
            echo "::notice title=Benchmark report::Open the job Summary tab for the Bencher report, download the e2e-benchmark-${{ github.run_number }} artifact for the benchmark JSON and Markdown files, or view the full history at ${BENCHER_PROJECT_URL}."
          else
            echo "::notice title=Benchmark report::Open the job Summary tab for the Bencher report or download the e2e-benchmark-${{ github.run_number }} artifact for the benchmark JSON and Markdown files. Set BENCHER_PROJECT_URL to include a direct Bencher history link here."
          fi

      - name: Dump logs on failure
        if: failure()
        working-directory: e2e/docker
        run: docker compose -f docker-compose.e2e.yml logs

      - name: Cleanup
        if: always()
        working-directory: e2e/docker
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans
