services:
  chaingen:
    command: ["chaingen", "--config-path", "/config/e2e_chaingen.toml"]

  check-chaingen:
    image: busybox:1.36
    env_file: .env
    depends_on:
      chaingen:
        condition: service_completed_successfully
    volumes:
      - stryi-e2e:/data
      - ../scripts:/scripts:ro
    command: ["/bin/sh", "-lc", "/scripts/check-chaingen.sh /data/chain"]
    restart: "no"

  server-node:
    depends_on:
      check-chaingen:
        condition: service_completed_successfully
    command:
      [
        "--config-path",
        "/config/e2e_server_node.toml",
        "--auto-accept-genesis",
        "true"
      ]

  wait-for-server-node:
    image: stryi-e2e-tools:ci
    networks:
      - e2e
    build:
      context: ../..
      dockerfile: e2e/docker/tools.Dockerfile
    env_file: .env
    depends_on:
      server-node:
        condition: service_healthy
    volumes:
      - ../scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/assert-node-ready.sh"]
    command:
      - --address
      - ${SERVER_NODE_HTTP_API_ADDRESS}
      - --http
      - "${SERVER_NODE_HTTP_API_PORT}"
      - --expected-height
      - "${EXPECTED_HEIGHT_BLOCK_250}"
      - --expected-hash
      - "${EXPECTED_HASH_BLOCK_250}"
    restart: "no"

  client-node-1:
    depends_on:
      server-node:
        condition: service_healthy
    command:
      [
        "--config-path",
        "/config/e2e_client_node1.toml",
        "--auto-accept-genesis",
        "true"
      ]

  wait-for-client-node-1:
    image: stryi-e2e-tools:ci
    networks:
      - e2e
    build:
      context: ../..
      dockerfile: e2e/docker/tools.Dockerfile
    env_file: .env
    depends_on:
      client-node-1:
        condition: service_healthy
    volumes:
      - ../scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/assert-node-ready.sh"]
    command:
      - --address
      - ${CLIENT1_NODE_HTTP_API_ADDRESS}
      - --http
      - "${CLIENT1_NODE_HTTP_API_PORT}"
      - --expected-height
      - "${EXPECTED_HEIGHT_BLOCK_250}"
      - --expected-hash
      - "${EXPECTED_HASH_BLOCK_250}"
    restart: "no"

  chaingen-reorg:
    image: stryi-e2e-devkit:ci
    build:
      context: ../..
      dockerfile: e2e/docker/devkit.Dockerfile
    env_file: .env
    depends_on:
      chaingen:
        condition: service_completed_successfully
    volumes:
      - stryi-e2e:/data
      - ../config:/config:ro
    environment:
      - RUST_LOG=${RUST_LOG}
    command: ["chaingen", "--config-path", "/config/e2e_chaingen_reorg.toml"]
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  check-chaingen-reorg:
    image: busybox:1.36
    env_file: .env
    depends_on:
      chaingen-reorg:
        condition: service_completed_successfully
    volumes:
      - stryi-e2e:/data
      - ../scripts:/scripts:ro
    command: ["/bin/sh", "-lc", "/scripts/check-chaingen.sh /data/chain_reorg"]
    restart: "no"

  client-node-2:
    depends_on:
      check-chaingen-reorg:
        condition: service_completed_successfully
      wait-for-client-node-1:
        condition: service_completed_successfully
      server-node:
        condition: service_healthy
    command:
      [
        "--config-path",
        "/config/e2e_client_node2.toml",
        "--auto-accept-genesis",
        "true"
      ]

  wait-for-reorg:
    image: stryi-e2e-tools:ci
    networks:
      - e2e
    build:
      context: ../..
      dockerfile: e2e/docker/tools.Dockerfile
    env_file: .env
    depends_on:
      client-node-2:
        condition: service_healthy
    volumes:
      - ../scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/assert-reorg-complete.sh"]
    command:
      - --node
      - "${SERVER_NODE_HTTP_API_ADDRESS}:${SERVER_NODE_HTTP_API_PORT}"
      - --node
      - "${CLIENT1_NODE_HTTP_API_ADDRESS}:${CLIENT1_NODE_HTTP_API_PORT}"
      - --node
      - "${CLIENT2_NODE_HTTP_API_ADDRESS}:${CLIENT2_NODE_HTTP_API_PORT}"
      - --expected-height
      - "${EXPECTED_HEIGHT_BLOCK_275}"
      - --expected-hash
      - "${EXPECTED_HASH_BLOCK_275}"
    restart: "no"
