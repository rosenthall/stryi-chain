services:
  # one-shot chaingen job that runs the devkit binary directly
  chaingen:
    build:
      context: ../..
      dockerfile: e2e/docker/devkit.Dockerfile
    volumes:
      - chain-data:/data
      - ../config:/config:ro # map repo/e2e/config -> /config in container
    environment:
      - RUST_LOG=info
    # NOTE: ENTRYPOINT in the image is ["stryi-devkit"], so we pass args as "command"
    command: ["chaingen", "--config-path", "/config/e2e_chaingen.toml"]
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


# test that chaingen did generate *something*
  check-chaingen:
    image: busybox:1.36
    depends_on:
      chaingen:
        condition: service_completed_successfully
    volumes:
      - chain-data:/data
      - ../scripts:/scripts:ro
    command: ["/bin/sh", "-lc", "/scripts/check-chaingen.sh /data/chain"]
    restart: "no"


  # TODO: Implement the rest of the docker-compose.e2e.yml
  # Note: for now just keep an infinite loop
  hold:
    image: busybox:1.36
    depends_on:
      chaingen:
        condition: service_completed_successfully
    command: ["/bin/sh", "-lc", "while true; do echo '[hold] still alive'; sleep 5; done"]
    volumes:
      - chain-data:/data

volumes:
  chain-data:

