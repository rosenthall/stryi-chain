services:
  # one-shot chaingen job that runs the devkit binary directly
  chaingen:
    build:
      context: ../..
      dockerfile: e2e/docker/devkit.Dockerfile
    env_file: .env
    volumes:
      - stryi-e2e:/data
      - ../config:/config:ro # map repo/e2e/config -> /config in container
    environment:
      - RUST_LOG=${RUST_LOG}
    # NOTE: ENTRYPOINT in the image is ["stryi-devkit"], so we pass args as "command"
    command: [ "chaingen", "--config-path", "/config/e2e_chaingen.toml" ]
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  # test that chaingen did generate *something*
  check-chaingen:
    image: busybox:1.36
    env_file: .env
    depends_on:
      chaingen:
        condition: service_completed_successfully
    volumes:
      - stryi-e2e:/data
      - ../scripts:/scripts:ro
    command: [ "/bin/sh", "-lc", "/scripts/check-chaingen.sh /data/chain" ]
    restart: "no"


  server-node:
    networks:
      - e2e
    build:
      context: ../..
      dockerfile: e2e/docker/node.Dockerfile
    env_file: .env
    depends_on:
      check-chaingen:
        condition: service_completed_successfully
    volumes:
      - stryi-e2e:/data
      - ../config:/config:ro
    environment:
      - RUST_LOG=${RUST_LOG}
    command:
      [
        "--config-path",
        "/config/e2e_server_node.toml",
        "--auto-accept-genesis",
        "true"
      ]
    restart: "no"
    # for local debugging purpose
    ports:
      - "${SERVER_NODE_GRPC_API_PORT}:${SERVER_NODE_GRPC_API_PORT}"
      - "${SERVER_NODE_HTTP_API_PORT}:${SERVER_NODE_HTTP_API_PORT}"
    # healthcheck to wait for the node to be ready (uses interpolated API_PORT)
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:${SERVER_NODE_HTTP_API_PORT}/api/nodestate"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s


  wait-for-server-node:
    networks:
      - e2e
    build:
      context: ../..
      dockerfile: e2e/docker/tools.Dockerfile
    env_file: .env
    # Prefer service_healthy so this container starts only after server-node passes healthcheck.
    # NOTE: some compose/platform versions differ in support for condition: service_healthy;
    # if your setup doesn't wait, the assert script will still poll /api/nodestate as a fallback.
    depends_on:
      server-node:
        condition: service_healthy
    volumes:
      - ../scripts:/scripts:ro
    entrypoint: [ "/bin/sh", "/scripts/assert-node-ready.sh" ]
    command:
      - --address
      - ${SERVER_NODE_HTTP_API_ADDRESS}
      - --http
      - "${SERVER_NODE_HTTP_API_PORT}"
      - --expected-height
      - "${EXPECTED_HEIGHT}"
      - --expected-hash
      - "${EXPECTED_HASH}"
    restart: "no"


  # Start one client node, that connects to the server node and syncs
  client-node-1:
    networks:
      - e2e
    build:
      context: ../..
      dockerfile: e2e/docker/node.Dockerfile
    env_file: .env
    depends_on:
      server-node:
        condition: service_healthy
    volumes:
      - stryi-e2e:/data
      - ../config:/config:ro
    environment:
      - RUST_LOG=${RUST_LOG}
    command:
      [
        "--config-path",
        "/config/e2e_client_node1.toml",
        "--auto-accept-genesis",
        "true"
      ]
    ports:
      - "${CLIENT1_NODE_GRPC_API_PORT}:${CLIENT1_NODE_GRPC_API_PORT}"
      - "${CLIENT1_NODE_HTTP_API_PORT}:${CLIENT1_NODE_HTTP_API_PORT}"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:${CLIENT1_NODE_HTTP_API_PORT}/api/nodestate"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: "no"


  wait-for-client-node-1:
    networks:
      - e2e
    build:
      context: ../..
      dockerfile: e2e/docker/tools.Dockerfile
    env_file: .env
    depends_on:
      client-node-1:
        condition: service_healthy
    volumes:
      - ../scripts:/scripts:ro
    entrypoint: [ "/bin/sh", "/scripts/assert-node-ready.sh" ]
    command:
      - --address
      - ${CLIENT1_NODE_HTTP_API_ADDRESS}
      - --http
      - "${CLIENT1_NODE_HTTP_API_PORT}"
      - --expected-height
      - "${EXPECTED_HEIGHT}"
      - --expected-hash
      - "${EXPECTED_HASH}"
    restart: "no"


  # TODO: Implement the rest of the docker-compose.e2e.yml


volumes:
  stryi-e2e:

networks:
  e2e:
