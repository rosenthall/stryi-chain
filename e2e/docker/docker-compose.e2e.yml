services:
  # one-shot chaingen job that runs the devkit binary directly
  chaingen:
    build:
      context: ../..
      dockerfile: e2e/docker/devkit.Dockerfile
    volumes:
      - chain-data:/data
      - ../config:/config:ro # map repo/e2e/config -> /config in container
    environment:
      - RUST_LOG=info
    # NOTE: ENTRYPOINT in the image is ["stryi-devkit"], so we pass args as "command"
    command: ["chaingen", "--config-path", "/config/e2e_chaingen.toml"]
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


# test that chaingen did generate *something*
  check-chaingen:
    image: busybox:1.36
    depends_on:
      chaingen:
        condition: service_completed_successfully
    volumes:
      - chain-data:/data
      - ../scripts:/scripts:ro
    command: ["/bin/sh", "-lc", "/scripts/check-chaingen.sh /data/chain"]
    restart: "no"

  server-node:
    networks:
      - e2e
    build:
      context: ../..
      dockerfile: e2e/docker/node.Dockerfile
    depends_on:
      check-chaingen:
        condition: service_completed_successfully
    volumes:
      - chain-data:/data
      - ../config:/config:ro
    environment:
      - RUST_LOG=info
    command:
      [
        "--config-path",
        "/config/e2e_server_node.toml",
        "--accept-genesis",
        "true"
      ]
    restart: "no"
    # for local debugging purpose
    ports:
      - "2080:2080"
      - "2090:2090"

  wait-for-server-node:
    networks:
      - e2e
    build:
      context: ../..
      dockerfile: e2e/docker/tools.Dockerfile
    depends_on:
      server-node:
        condition: service_started
    volumes:
      - ../scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/assert-node-ready.sh"]
    command:
      - --address
      - server-node
      - --http
      - "2090"
      - --expected-hash
      - Bx02f4b49f47b6f5506bd0c20fbe5739e4a23493353713bfa673c72567dc482241
    restart: "no"



  # TODO: Implement the rest of the docker-compose.e2e.yml

volumes:
  chain-data:

networks:
  e2e:
